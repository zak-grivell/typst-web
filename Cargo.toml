[package]
name = "typst-web"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "=0.7.5", default-features = false, features = ["launch", "macro", "html", "signals", "hooks", "logger"] }
base64 = "0.22.1"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
flate2 = "1.1.9"
tar = "0.4.44"
time = { version = "0.3.44", features = ["formatting"] }
typst = "0.14.2"
typst-svg = "0.14.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.52.2", features = ["rt"] }
typst-as-lib = { version = "0.15.4", features = ["packages", "typst-kit-fonts", "ureq"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = "0.6.0"
js-sys = "0.3.83"
typst-as-lib = { version = "0.15.4", features = ["typst-kit-embed-fonts", "typst-kit-fonts"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
